<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Babysitters Around</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="app">


    <!-- ========================= -->
    <!-- WELCOME -->
    <!-- ========================= -->

    <section
      id="welcomeScreen"
      class="screen welcome"
    >

      <div class="logo">
        👶
      </div>

      <h1>
        Babysitters Around
      </h1>

      <p class="subtitle">
        Найдите русскоязычную няню рядом
        с вами или найдите семью для работы.
      </p>

      <div class="buttons">

        <button
          class="button button-primary"
          onclick="chooseRole('parent')"
        >
          Я родитель
        </button>

        <button
          class="button button-secondary"
          onclick="chooseRole('nanny')"
        >
          Я няня
        </button>

      </div>

    </section>



    <!-- ========================= -->
    <!-- PARENT HOME -->
    <!-- ========================= -->

    <section
      id="parentHome"
      class="screen hidden"
    >

      <header class="main-header">

        <h1>
          Главная
        </h1>

        <p>
          Babysitters Around
        </p>

      </header>


      <div class="menu">

        <button
          class="menu-button"
          onclick="openFeature('Поиск няни')"
        >
          <span class="menu-icon">🔎</span>
          <span>Найти няню</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Мои заявки')"
        >
          <span class="menu-icon">📋</span>
          <span>Мои заявки</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Мой профиль')"
        >
          <span class="menu-icon">👤</span>
          <span>Мой профиль</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Отзывы')"
        >
          <span class="menu-icon">⭐</span>
          <span>Отзывы</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Поддержать проект')"
        >
          <span class="menu-icon">❤️</span>
          <span>Поддержать проект</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Настройки')"
        >
          <span class="menu-icon">⚙️</span>
          <span>Настройки</span>
        </button>

      </div>


      <button
        class="close-button"
        onclick="goWelcome()"
      >
        ← Назад
      </button>

    </section>



    <!-- ========================= -->
    <!-- NANNY HOME -->
    <!-- ========================= -->

    <section
      id="nannyHome"
      class="screen hidden"
    >

      <header class="main-header">

        <h1>
          Главная
        </h1>

        <p>
          Babysitters Around
        </p>

      </header>


      <div class="menu">


        <button
          class="menu-button"
          onclick="openFeature('Мои заявки')"
        >
          <span class="menu-icon">📋</span>
          <span>Мои заявки</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Моя анкета')"
        >
          <span class="menu-icon">👩‍🍼</span>
          <span>Моя анкета</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Доступность')"
        >
          <span class="menu-icon">📅</span>
          <span>Доступность</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Мой профиль')"
        >
          <span class="menu-icon">👤</span>
          <span>Мой профиль</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Отзывы')"
        >
          <span class="menu-icon">⭐</span>
          <span>Отзывы</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Поддержать проект')"
        >
          <span class="menu-icon">❤️</span>
          <span>Поддержать проект</span>
        </button>


        <button
          class="menu-button"
          onclick="openFeature('Настройки')"
        >
          <span class="menu-icon">⚙️</span>
          <span>Настройки</span>
        </button>

      </div>


      <button
        class="close-button"
        onclick="goWelcome()"
      >
        ← Назад
      </button>

    </section>


  </main>


  <script src="app.js"></script>

</body>

</html>
