<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Babysitters Around</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fffaf7;
      color: #333;
    }

    .app {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .screen {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      border-radius: 28px;
      background: #f3d9c9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0 auto 36px;
      max-width: 340px;
      font-size: 17px;
      line-height: 1.5;
      color: #777;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 17px 20px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      background: #333;
      color: white;
    }

    .secondary {
      background: white;
      color: #333;
      border: 1px solid #ddd;
    }

    .hidden {
      display: none;
    }

    .back {
      margin-top: 24px;
      background: transparent;
      color: #777;
      font-weight: 400;
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- Экран приветствия -->
    <section id="welcomeScreen" class="screen">

      <div class="logo">👶</div>

      <h1>Babysitters Around</h1>

      <p class="subtitle">
        Найдите русскоязычную няню рядом с вами
        или найдите семью для работы.
      </p>

      <div class="buttons">

        <button class="primary" onclick="chooseRole('parent')">
          Я родитель
        </button>

        <button class="secondary" onclick="chooseRole('nanny')">
          Я няня
        </button>

      </div>

    </section>


    <!-- Экран родителя -->
    <section id="parentScreen" class="screen hidden">

      <div class="logo">👨‍👩‍👧</div>

      <h1>Добро пожаловать!</h1>

      <p class="subtitle">
        Здесь мы постепенно создадим
        поиск нянь и заявки.
      </p>

      <button class="primary" onclick="goHome()">
        На главную
      </button>

      <button class="back" onclick="goWelcome()">
        ← Назад
      </button>

    </section>


    <!-- Экран няни -->
    <section id="nannyScreen" class="screen hidden">

      <div class="logo">👩‍🍼</div>

      <h1>Добро пожаловать!</h1>

      <p class="subtitle">
        Здесь мы постепенно создадим
        вашу анкету и календарь доступности.
      </p>

      <button class="primary" onclick="goHome()">
        На главную
      </button>

      <button class="back" onclick="goWelcome()">
        ← Назад
      </button>

    </section>

  </main>


  <script>
    function chooseRole(role) {

      document.getElementById("welcomeScreen").classList.add("hidden");

      if (role === "parent") {
        document.getElementById("parentScreen").classList.remove("hidden");
      }

      if (role === "nanny") {
        document.getElementById("nannyScreen").classList.remove("hidden");
      }
    }

    function goWelcome() {

      document.getElementById("parentScreen").classList.add("hidden");
      document.getElementById("nannyScreen").classList.add("hidden");

      document.getElementById("welcomeScreen").classList.remove("hidden");
    }

    function goHome() {

      alert("Главная Babysitters Around пока находится в разработке ❤️");
    }
  </script>

</body>
</html>
